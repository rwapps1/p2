<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palabra — Spanish Vocab Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --bg: #A6091C;
    --bg-card: #8C0817;
    --bg-card-alt: #7A0713;
    --ochre: #FFC400;
    --terracotta: #FF6B57;
    --cream: #FFF6E0;
    --cream-dim: #F0BFC0;
    --green: #4C9A5B;
    --red: #FF6B57;
    --outline: #5C0E14;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, rgba(255,196,0,0.04) 25%, transparent 25%, transparent 75%, rgba(255,196,0,0.04) 75%, rgba(255,196,0,0.04)),
      linear-gradient(45deg, rgba(255,196,0,0.04) 25%, transparent 25%, transparent 75%, rgba(255,196,0,0.04) 75%, rgba(255,196,0,0.04));
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }
  .upload-screen { justify-content: center; }

  .wrap { width: 100%; max-width: 420px; perspective: 700px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--ochre);
    text-transform: uppercase;
    text-align: center;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 10px 0 4px;
  }
  .badge {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(255,196,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .badge svg { width: 24px; height: 24px; color: var(--ochre); }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 42px;
    margin: 0;
    line-height: 1.05;
    text-align: center;
  }
  .sub {
    color: var(--cream-dim);
    font-size: 15px;
    line-height: 1.5;
    text-align: center;
    margin: 0 0 20px;
  }

  .card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--outline);
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--outline);
    border-top-color: var(--ochre);
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dropzone {
    display: block;
    text-align: center;
    padding: 28px 16px;
    border: 2px dashed var(--outline);
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .dropzone .icon { font-size: 28px; margin-bottom: 6px; }
  .dropzone .name { font-weight: 600; }
  .dropzone .hint { font-size: 13px; color: var(--cream-dim); margin-top: 4px; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 16px;
  }

  .msg-error {
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .msg-ok {
    font-size: 14px;
    color: var(--ochre);
    margin-bottom: 16px;
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-bottom: 16px;
    display: inline-block;
  }

  button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 16px;
    background: var(--ochre);
    color: var(--bg);
  }
  .btn-primary:disabled {
    cursor: not-allowed;
    background: var(--outline);
    color: var(--cream-dim);
  }
  .btn-secondary {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: 1px solid var(--outline);
    font-weight: 600;
    font-size: 14px;
    background: transparent;
    color: var(--cream);
  }

  .tiles {
    display: grid;
    gap: 4px;
    margin-bottom: 32px;
  }
  .tile { height: 8px; border-radius: 2px; background: var(--outline); }

  .progress-label {
    text-align: center;
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--ochre);
  }

  .prompt-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
    border: 1px solid var(--outline);
    margin-bottom: 20px;
  }
  .card-flip-in { animation: cardFlip 0.5s ease; }
  @keyframes cardFlip {
    from { transform: rotateY(-90deg); opacity: 0; }
    to { transform: rotateY(0deg); opacity: 1; }
  }
  .prompt-card.flash-correct { box-shadow: 0 0 0 3px var(--green) inset; }
  .prompt-card.flash-wrong { box-shadow: 0 0 0 3px var(--red) inset; }

  .ta-header { margin-bottom: 24px; }
  .ta-timer-track {
    height: 8px;
    background: var(--outline);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .ta-timer-fill {
    height: 100%;
    background: var(--ochre);
    border-radius: 4px;
    transition: width 0.25s linear;
  }
  .ta-stats-row {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--cream-dim);
  }
  .ta-score-label span, .ta-timer-label { color: var(--ochre); font-weight: 600; }
  .prompt-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .prompt-word {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
  }
  .speak-btn {
    background: none;
    border: 1px solid var(--outline);
    color: var(--cream);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .speak-btn.speaking {
    border-color: var(--ochre);
    color: var(--ochre);
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,196,0,0.5); }
    50% { box-shadow: 0 0 0 8px rgba(255,196,0,0); }
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream);
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
    font-family: 'Inter', sans-serif;
  }

  .option-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .option-btn {
    width: 100%;
    padding: 16px 18px;
    border-radius: 10px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream);
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--ochre); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct-choice { background: rgba(76,154,91,0.35); border-color: var(--green); }
  .option-btn.wrong-choice { background: rgba(255,107,87,0.35); border-color: var(--red); }
  .option-btn.pop-anim { animation: pop 0.4s ease; }
  .option-btn.shake-anim { animation: shake 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .countdown-bar-track {
    height: 4px;
    background: var(--outline);
    border-radius: 2px;
    overflow: hidden;
    margin: 10px 0 4px;
  }
  .countdown-bar-fill {
    height: 100%;
    width: 100%;
    background: var(--ochre);
    border-radius: 2px;
    transition: width 3s linear;
  }

  .feedback {
    padding: 16px 18px;
    border-radius: 10px;
    margin-bottom: 12px;
    animation: pop 0.3s ease;
  }
  .feedback.correct {
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--green);
  }
  .feedback.wrong {
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--red);
    animation: shake 0.4s ease;
  }
  .feedback .title { font-weight: 600; }
  .feedback .answer { font-size: 14px; color: var(--cream-dim); margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .feedback .answer strong { color: var(--cream); }

  .score-big {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    text-align: center;
  }

  .new-best {
    text-align: center;
    color: var(--ochre);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .streak-line {
    text-align: center;
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 20px;
  }

  .mosaic {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 28px;
  }
  .mosaic .sq { aspect-ratio: 1; border-radius: 4px; }

  .review-title { font-weight: 600; margin-bottom: 12px; }
  .review-item {
    font-size: 14px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--outline);
  }
  .review-item:last-child { border-bottom: none; margin-bottom: 0; }
  .review-item .from { color: var(--cream-dim); }
  .review-item .to { color: var(--cream); font-weight: 600; }
  .review-item .yours { color: var(--terracotta); font-size: 13px; margin-top: 2px; }

  .btn-row { display: flex; gap: 10px; }

  .settings-group { margin-bottom: 16px; text-align: left; }
  .settings-label {
    font-size: 12px;
    color: var(--cream-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .segmented { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-btn {
    flex: 1;
    min-width: 64px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream-dim);
    font-size: 13px;
    font-weight: 600;
  }
  .seg-btn.active {
    background: var(--ochre);
    border-color: var(--ochre);
    color: var(--bg);
  }

  .confetti-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
  }
  .confetti-piece {
    position: absolute;
    top: -12px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }

  .achievement-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--outline);
  }
  .achievement-item:last-child { border-bottom: none; }
  .achievement-item.locked { opacity: 0.45; }
  .ach-icon { font-size: 26px; width: 36px; text-align: center; flex-shrink: 0; }
  .ach-name { font-weight: 600; font-size: 15px; }
  .ach-desc { font-size: 13px; color: var(--cream-dim); }

  .achievement-toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    opacity: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--ochre);
    border-radius: 12px;
    padding: 12px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 1000;
    transition: opacity 0.3s ease, transform 0.3s ease;
    max-width: 90vw;
  }
  .achievement-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-icon { font-size: 26px; }
  .toast-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ochre); }
  .toast-name { font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // ── Edit this to match the file name sitting in your repo ──
  const WORDS_FILE = 'words.xlsx';
  // ─────────────────────────────────────────────────────────

  const STORAGE_KEY = 'palabraProgress_v1';

  const COLORS = {
    green: '#4C9A5B',
    red: '#FF6B57',
    ochre: '#FFC400',
  };

  // Simplified Leitner-style spaced repetition: box index -> days until next due
  const SRS_INTERVALS_DAYS = [0, 1, 3, 7, 16, 35];

  function defaultProgress() {
    return {
      wordStats: {},
      streak: { current: 0, best: 0 },
      lifetime: { totalAnswered: 0, totalCorrect: 0 },
      timeAttackBest: 0,
      settings: { direction: 'mixed', roundLength: '20', autoSpeak: true, answerMode: 'type', soundEffects: true },
      achievements: {},
    };
  }

  const ACHIEVEMENTS = {
    firstRound:  { name: 'First Steps',    desc: 'Complete your first round',              icon: '👟' },
    perfectRound:{ name: 'Perfect Round',  desc: 'Score 100% in a round',                  icon: '💯' },
    streak10:    { name: 'On Fire',        desc: 'Reach a 10-answer streak',                icon: '🔥' },
    streak25:    { name: 'Unstoppable',    desc: 'Reach a 25-answer streak',                icon: '⚡' },
    correct50:   { name: 'Word Explorer',  desc: '50 lifetime correct answers',             icon: '🧭' },
    correct200:  { name: 'Word Master',    desc: '200 lifetime correct answers',            icon: '🎓' },
    bigRound:    { name: 'Marathon',       desc: 'Complete a round of 50 or more words',    icon: '🏃' },
    allWords:    { name: 'Completionist',  desc: 'Quiz your entire word list in one round', icon: '📚' },
    timeAttack10: { name: 'Quickdraw',      desc: 'Score 10 in a single Time Attack round',  icon: '🎯' },
    timeAttack25: { name: 'Speed Runner',   desc: 'Score 25 in a single Time Attack round',  icon: '🚀' },
    timeAttack50: { name: 'Lightning Round',desc: 'Score 50 in a single Time Attack round',  icon: '🌪️' },
    timeAttack100:{ name: 'Blur',           desc: 'Score 100 in a single Time Attack round', icon: '👑' },
  };

  function normalizeWordStats(wordStats) {
    Object.keys(wordStats).forEach(key => {
      const ws = wordStats[key];
      if (typeof ws.box !== 'number') {
        const right = ws.right || 0;
        const wrong = ws.wrong || 0;
        ws.box = wrong > 0 ? 0 : Math.min(right, SRS_INTERVALS_DAYS.length - 1);
        ws.nextDue = 0;
        ws.lastSeen = ws.lastSeen || 0;
      }
    });
    return wordStats;
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      const parsed = JSON.parse(raw);
      const merged = defaultProgress();
      merged.wordStats = normalizeWordStats(parsed.wordStats || {});
      merged.streak = Object.assign(merged.streak, parsed.streak || {});
      merged.lifetime = Object.assign(merged.lifetime, parsed.lifetime || {});
      merged.timeAttackBest = typeof parsed.timeAttackBest === 'number' ? parsed.timeAttackBest : 0;
      merged.settings = Object.assign(merged.settings, parsed.settings || {});
      merged.achievements = Object.assign({}, parsed.achievements || {});
      return merged;
    } catch (e) {
      return defaultProgress();
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {
      // storage unavailable (private browsing etc.) - fail silently
    }
  }

  function exportProgress() {
    const blob = new Blob([JSON.stringify(state.progress, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'palabra-progress.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importProgress(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        const merged = defaultProgress();
        merged.wordStats = normalizeWordStats(parsed.wordStats || {});
        merged.streak = Object.assign(merged.streak, parsed.streak || {});
        merged.lifetime = Object.assign(merged.lifetime, parsed.lifetime || {});
        merged.timeAttackBest = typeof parsed.timeAttackBest === 'number' ? parsed.timeAttackBest : 0;
        merged.settings = Object.assign(merged.settings, parsed.settings || {});
        merged.achievements = Object.assign({}, parsed.achievements || {});
        state.progress = merged;
        saveProgress();
        render();
      } catch (e) {
        alert("That file doesn't look like a valid progress export.");
      }
    };
    reader.readAsText(file);
  }

  const state = {
    screen: 'start', // start | quiz | result
    loading: true,
    fetchFailed: false,
    showUpload: false,
    pairs: [],
    error: '',
    hasHeader: true,
    fileName: '',
    rawRows: null,
    questions: [],
    index: 0,
    input: '',
    checked: false,
    wasCorrect: false,
    results: [],
    newBestThisRound: false,
    progress: loadProgress(),
    effectiveAnswerMode: 'type',
    currentOptions: null,
    selectedOption: null,
    autoAdvanceTimer: null,
    lastFlippedIndex: -1,
    lastWasTypo: false,
    resultMode: 'round', // 'round' | 'timeattack'
    taActive: false,
    taScore: 0,
    taTimeLeft: 60,
    taEndTime: 0,
    taTimerHandle: null,
    taFlashTimer: null,
    taCurrentQuestion: null,
    taCurrentOptions: null,
    taInput: '',
    taIsNewBest: false,
  };

  function normalize(str) {
    return str.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function splitAnswers(cell) {
    return cell.toString().split(/[/;,]/).map(s => s.trim()).filter(Boolean);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function wordKey(pair) {
    return normalize(pair.es) + '::' + normalize(pair.en);
  }

  function getWeight(pair) {
    const stats = state.progress.wordStats[wordKey(pair)];
    const now = Date.now();
    if (!stats) return 12; // never seen - high priority
    const overdueMs = now - (stats.nextDue || 0);
    if (overdueMs >= 0) {
      // due or overdue - the longer overdue, the higher the priority
      const overdueDays = overdueMs / 86400000;
      return 6 + Math.min(overdueDays, 12) * 1.5;
    }
    // not yet due - small residual chance, higher the closer it is to becoming due
    const daysUntilDue = -overdueMs / 86400000;
    return Math.max(0.2, 3 / (1 + daysUntilDue * 2));
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const temp = dp[j];
        dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
        prev = temp;
      }
    }
    return dp[n];
  }

  function isCloseMatch(userNorm, ansNorm) {
    if (!userNorm || !ansNorm) return false;
    if (userNorm === ansNorm) return true;
    const dist = levenshtein(userNorm, ansNorm);
    const len = Math.max(userNorm.length, ansNorm.length);
    const threshold = Math.max(1, Math.round(len * 0.4));
    return dist <= threshold;
  }

  function isAnswerCorrect(input, targetField) {
    const userNorm = normalize(input);
    if (userNorm.length === 0) return false;
    const acceptable = splitAnswers(targetField).map(normalize);
    if (acceptable.includes(userNorm)) return true;
    return acceptable.some(ans => isCloseMatch(userNorm, ans));
  }

  function weightedSampleWithoutReplacement(items, weightFn, count) {
    const pool = items.map(item => ({ item, weight: Math.max(weightFn(item), 0.0001) }));
    const result = [];
    while (result.length < count && pool.length > 0) {
      const totalWeight = pool.reduce((sum, p) => sum + p.weight, 0);
      let r = Math.random() * totalWeight;
      let idx = 0;
      for (; idx < pool.length - 1; idx++) {
        r -= pool[idx].weight;
        if (r <= 0) break;
      }
      result.push(pool[idx].item);
      pool.splice(idx, 1);
    }
    return result;
  }

  function weightedPickOne(items, weightFn, excludeKey) {
    let pool = items;
    if (excludeKey && items.length > 1) {
      const filtered = items.filter(p => wordKey(p) !== excludeKey);
      if (filtered.length > 0) pool = filtered;
    }
    const weights = pool.map(p => Math.max(weightFn(p), 0.0001));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function buildRound(pairs, length, directionSetting) {
    let selected = [];
    while (selected.length < length) {
      const remaining = length - selected.length;
      const batchSize = Math.min(remaining, pairs.length);
      const batch = weightedSampleWithoutReplacement(pairs, getWeight, batchSize);
      selected = selected.concat(batch);
    }
    return selected.map(p => ({
      ...p,
      direction: directionSetting === 'mixed' ? (Math.random() < 0.5 ? 'es-en' : 'en-es') : directionSetting,
    }));
  }

  function getDistractors(current, correctText, count) {
    const isEnglishTarget = current.direction === 'es-en';
    const seen = new Set([normalize(correctText)]);
    const candidates = [];
    state.pairs.forEach(p => {
      if (wordKey(p) === wordKey(current)) return;
      const field = isEnglishTarget ? p.en : p.es;
      const text = splitAnswers(field)[0];
      if (!text) return;
      const n = normalize(text);
      if (seen.has(n)) return;
      seen.add(n);
      candidates.push(text);
    });
    return shuffle(candidates).slice(0, count);
  }

  function speak(text, lang, btnEl) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      if (btnEl) {
        utter.onstart = () => btnEl.classList.add('speaking');
        utter.onend = () => btnEl.classList.remove('speaking');
        utter.onerror = () => btnEl.classList.remove('speaking');
      }
      window.speechSynthesis.speak(utter);
    } catch (e) {
      // speech is a nice-to-have, never let it break the quiz
    }
  }

  let audioCtx = null;
  function getAudioCtx() {
    if (!('AudioContext' in window || 'webkitAudioContext' in window)) return null;
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playNote(ctx, freq, startTime, duration, type) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.22, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
  }

  function playCorrectSound() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playNote(ctx, 523.25, now, 0.12, 'sine');
    playNote(ctx, 659.25, now + 0.09, 0.16, 'sine');
  }

  function playWrongSound() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playNote(ctx, 196, now, 0.25, 'sawtooth');
  }

  function playAchievementSound() {
    if (!state.progress.settings.soundEffects) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    playNote(ctx, 523.25, now, 0.12, 'triangle');
    playNote(ctx, 659.25, now + 0.1, 0.12, 'triangle');
    playNote(ctx, 783.99, now + 0.2, 0.2, 'triangle');
  }

  function showAchievementToast(id) {
    const def = ACHIEVEMENTS[id];
    if (!def) return;
    const toast = document.createElement('div');
    toast.className = 'achievement-toast';
    toast.innerHTML = `<div class="toast-icon">${def.icon}</div><div><div class="toast-title">Achievement unlocked</div><div class="toast-name">${esc(def.name)}</div></div>`;
    document.body.appendChild(toast);
    requestAnimationFrame(() => { toast.classList.add('show'); });
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 400);
    }, 2600);
  }

  function unlockAchievement(id) {
    if (!ACHIEVEMENTS[id]) return false;
    if (!state.progress.achievements) state.progress.achievements = {};
    if (state.progress.achievements[id] && state.progress.achievements[id].unlocked) return false;
    state.progress.achievements[id] = { unlocked: true, unlockedAt: Date.now() };
    saveProgress();
    playAchievementSound();
    showAchievementToast(id);
    return true;
  }

  function evaluateRoundAchievements() {
    const score = state.results.filter(r => r.correct).length;
    const total = state.results.length;
    unlockAchievement('firstRound');
    if (total > 0 && score === total) unlockAchievement('perfectRound');
    if (state.questions.length >= 50) unlockAchievement('bigRound');
    if (state.progress.settings.roundLength === 'all') unlockAchievement('allWords');
  }

  function launchConfetti() {
    const container = document.createElement('div');
    container.className = 'confetti-container';
    document.body.appendChild(container);
    const colors = ['#FFC400', '#FF6B57', '#FFF6E0', '#4C9A5B'];
    const count = 44;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.35) + 's';
      piece.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
      piece.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
      container.appendChild(piece);
    }
    setTimeout(() => { container.remove(); }, 3500);
  }

  function parseRows(rows, skipHeader) {
    const startIdx = skipHeader ? 1 : 0;
    const cleaned = [];
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      const es = (row[0] ?? '').toString().trim();
      const en = (row[1] ?? '').toString().trim();
      if (es && en) cleaned.push({ es, en });
    }
    if (cleaned.length === 0) {
      state.error = 'No word pairs found. Make sure column A has Spanish and column B has English.';
      state.pairs = [];
    } else {
      state.error = '';
      state.pairs = cleaned;
    }
    render();
  }

  // Auto-load the word list from the repo on page load
  async function loadFromRepo() {
    state.loading = true;
    state.fetchFailed = false;
    render();
    try {
      const resp = await fetch(WORDS_FILE);
      if (!resp.ok) throw new Error('File not found: ' + resp.status);
      const buf = await resp.arrayBuffer();
      const data = new Uint8Array(buf);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      state.rawRows = rows;
      state.fileName = WORDS_FILE;
      state.loading = false;
      parseRows(rows, state.hasHeader);
    } catch (err) {
      state.loading = false;
      state.fetchFailed = true;
      state.showUpload = true;
      state.error = "Couldn't load \"" + WORDS_FILE + "\" automatically. If you're opening this file directly on your computer rather than through GitHub Pages or a local server, browsers block that kind of file access — try uploading it manually below, or view the page via its GitHub Pages URL instead.";
      render();
    }
  }

  function handleFile(file) {
    if (!file) return;
    state.error = '';
    state.fileName = file.name;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        state.rawRows = rows;
        parseRows(rows, state.hasHeader);
      } catch (err) {
        state.error = "Couldn't read that file. Make sure it's a valid .xlsx or .xls file.";
        state.pairs = [];
        render();
      }
    };
    reader.onerror = () => { state.error = "Couldn't read that file."; render(); };
    reader.readAsArrayBuffer(file);
  }

  function toggleHeader() {
    state.hasHeader = !state.hasHeader;
    if (state.rawRows) parseRows(state.rawRows, state.hasHeader);
    else render();
  }

  function clearAutoAdvanceTimer() {
    if (state.autoAdvanceTimer) {
      clearTimeout(state.autoAdvanceTimer);
      state.autoAdvanceTimer = null;
    }
  }

  function prepareQuestion() {
    clearAutoAdvanceTimer();
    state.selectedOption = null;
    state.lastWasTypo = false;
    const current = state.questions[state.index];
    if (state.effectiveAnswerMode === 'choice' && current) {
      const targetField = current.direction === 'es-en' ? current.en : current.es;
      const correctText = splitAnswers(targetField)[0];
      const distractors = getDistractors(current, correctText, 2);
      state.currentOptions = distractors.length >= 2 ? shuffle([correctText, ...distractors]) : null;
    } else {
      state.currentOptions = null;
    }
  }

  function startQuiz() {
    const settings = state.progress.settings;
    const roundLen = settings.roundLength === 'all' ? state.pairs.length : parseInt(settings.roundLength, 10);
    state.questions = buildRound(state.pairs, roundLen, settings.direction);
    state.index = 0;
    state.results = [];
    state.input = '';
    state.checked = false;
    state.newBestThisRound = false;
    state.lastFlippedIndex = -1;
    state.resultMode = 'round';
    state.effectiveAnswerMode = (settings.answerMode === 'choice' && state.pairs.length >= 3) ? 'choice' : 'type';
    prepareQuestion();
    state.screen = 'quiz';
    render();
  }

  function recordAnswer(current, correct, userAnswerDisplay) {
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    state.wasCorrect = correct;
    state.checked = true;
    state.results.push({
      prompt: current.direction === 'es-en' ? current.es : current.en,
      correctAnswer: targetField,
      userAnswer: userAnswerDisplay,
      correct,
    });

    const key = wordKey(current);
    if (!state.progress.wordStats[key]) {
      state.progress.wordStats[key] = { box: 0, nextDue: 0, right: 0, wrong: 0, lastSeen: 0 };
    }
    const ws = state.progress.wordStats[key];
    const now = Date.now();
    ws.lastSeen = now;
    if (correct) {
      ws.right += 1;
      ws.box = Math.min((ws.box || 0) + 1, SRS_INTERVALS_DAYS.length - 1);
      ws.nextDue = now + SRS_INTERVALS_DAYS[ws.box] * 86400000;
      state.progress.streak.current += 1;
      if (state.progress.streak.current > state.progress.streak.best) {
        state.progress.streak.best = state.progress.streak.current;
        state.newBestThisRound = true;
      }
    } else {
      ws.wrong += 1;
      ws.box = 0;
      ws.nextDue = now; // due again straight away
      state.progress.streak.current = 0;
    }
    state.progress.lifetime.totalAnswered += 1;
    if (correct) state.progress.lifetime.totalCorrect += 1;
    saveProgress();

    if (correct) playCorrectSound(); else playWrongSound();
    if (state.progress.streak.current >= 10) unlockAchievement('streak10');
    if (state.progress.streak.current >= 25) unlockAchievement('streak25');
    if (state.progress.lifetime.totalCorrect >= 50) unlockAchievement('correct50');
    if (state.progress.lifetime.totalCorrect >= 200) unlockAchievement('correct200');
  }

  function submitAnswer() {
    const current = state.questions[state.index];
    if (!current || state.checked) return;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const userNorm = normalize(state.input);
    const acceptable = splitAnswers(targetField).map(normalize);
    let correct = false;
    let wasTypo = false;
    if (userNorm.length > 0) {
      if (acceptable.includes(userNorm)) {
        correct = true;
      } else if (acceptable.some(ans => isCloseMatch(userNorm, ans))) {
        correct = true;
        wasTypo = true;
      }
    }
    state.lastWasTypo = wasTypo;
    recordAnswer(current, correct, state.input);
    render();
  }

  function selectOption(optionText) {
    const current = state.questions[state.index];
    if (!current || state.checked) return;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const acceptable = splitAnswers(targetField).map(normalize);
    const correct = acceptable.includes(normalize(optionText));
    state.selectedOption = optionText;
    recordAnswer(current, correct, optionText);
    render();
    const delay = correct ? 750 : 3000;
    state.autoAdvanceTimer = setTimeout(() => { nextQuestion(); }, delay);
  }

  function nextQuestion() {
    clearAutoAdvanceTimer();
    if (state.index + 1 >= state.questions.length) {
      state.screen = 'result';
      evaluateRoundAchievements();
    } else {
      state.index += 1;
      state.input = '';
      state.checked = false;
      prepareQuestion();
    }
    render();
  }

  function playAgainFromScratch() {
    state.screen = 'start';
    loadFromRepo();
  }

  function backToMenu() {
    state.screen = 'start';
    render();
  }

  function clearTaTimerInterval() {
    if (state.taTimerHandle) {
      clearInterval(state.taTimerHandle);
      state.taTimerHandle = null;
    }
  }

  function clearTaFlashTimer() {
    if (state.taFlashTimer) {
      clearTimeout(state.taFlashTimer);
      state.taFlashTimer = null;
    }
  }

  function checkTimeAttackAchievements() {
    if (state.taScore >= 10) unlockAchievement('timeAttack10');
    if (state.taScore >= 25) unlockAchievement('timeAttack25');
    if (state.taScore >= 50) unlockAchievement('timeAttack50');
    if (state.taScore >= 100) unlockAchievement('timeAttack100');
  }

  function loadNextTimeAttackQuestion() {
    const settings = state.progress.settings;
    const prevKey = state.taCurrentQuestion ? wordKey(state.taCurrentQuestion) : null;
    const picked = weightedPickOne(state.pairs, getWeight, prevKey);
    const direction = settings.direction === 'mixed' ? (Math.random() < 0.5 ? 'es-en' : 'en-es') : settings.direction;
    const current = { ...picked, direction };
    state.taCurrentQuestion = current;
    state.taSelectedOption = null;
    state.taInput = '';
    if (state.effectiveAnswerMode === 'choice') {
      const targetField = direction === 'es-en' ? current.en : current.es;
      const correctText = splitAnswers(targetField)[0];
      const distractors = getDistractors(current, correctText, 2);
      state.taCurrentOptions = distractors.length >= 2 ? shuffle([correctText, ...distractors]) : null;
    } else {
      state.taCurrentOptions = null;
    }
  }

  function startTimeAttack() {
    if (state.pairs.length === 0) return;
    const settings = state.progress.settings;
    state.results = [];
    state.taScore = 0;
    state.taActive = true;
    state.taIsNewBest = false;
    state.taEndTime = Date.now() + 60000;
    state.taTimeLeft = 60;
    state.resultMode = 'timeattack';
    state.effectiveAnswerMode = (settings.answerMode === 'choice' && state.pairs.length >= 3) ? 'choice' : 'type';
    loadNextTimeAttackQuestion();
    state.screen = 'timeattack';
    render();
    clearTaTimerInterval();
    state.taTimerHandle = setInterval(tickTimeAttack, 250);
  }

  function tickTimeAttack() {
    if (!state.taActive) return;
    const remainingMs = Math.max(0, state.taEndTime - Date.now());
    state.taTimeLeft = Math.ceil(remainingMs / 1000);
    const timerLabel = document.getElementById('ta-timer');
    if (timerLabel) timerLabel.textContent = state.taTimeLeft + 's';
    const fill = document.getElementById('ta-timer-fill');
    if (fill) fill.style.width = (remainingMs / 60000 * 100) + '%';
    if (remainingMs <= 0) {
      endTimeAttack();
    }
  }

  function taSubmit(correct, displayValue) {
    if (!state.taActive) return;
    const current = state.taCurrentQuestion;
    recordAnswer(current, correct, displayValue);
    if (correct) {
      state.taScore++;
      checkTimeAttackAchievements();
    }
    const scoreEl = document.getElementById('ta-score');
    if (scoreEl) scoreEl.textContent = state.taScore;
    const promptEl = document.getElementById('ta-prompt-card');
    if (promptEl) promptEl.classList.add(correct ? 'flash-correct' : 'flash-wrong');

    clearTaFlashTimer();
    const delay = correct ? 220 : 420;
    state.taFlashTimer = setTimeout(() => {
      if (!state.taActive) return;
      loadNextTimeAttackQuestion();
      render();
    }, delay);
  }

  function handleTaTypedSubmit() {
    if (!state.taActive) return;
    const current = state.taCurrentQuestion;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const correct = isAnswerCorrect(state.taInput, targetField);
    taSubmit(correct, state.taInput);
  }

  function taSelectOption(optionText) {
    if (!state.taActive) return;
    const current = state.taCurrentQuestion;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const acceptable = splitAnswers(targetField).map(normalize);
    const correct = acceptable.includes(normalize(optionText));
    taSubmit(correct, optionText);
  }

  function endTimeAttack() {
    if (!state.taActive) return;
    state.taActive = false;
    clearTaTimerInterval();
    clearTaFlashTimer();
    const isNewBest = state.taScore > (state.progress.timeAttackBest || 0);
    if (isNewBest) {
      state.progress.timeAttackBest = state.taScore;
    }
    saveProgress();
    state.taIsNewBest = isNewBest;
    state.resultMode = 'timeattack';
    state.screen = 'result';
    render();
    if (isNewBest || state.taScore >= 25) launchConfetti();
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

      document.getElementById('timeattack-btn').addEventListener('click', startTimeAttack);
      if (state.showUpload) {
        document.getElementById('file-upload').addEventListener('change', (e) => handleFile(e.target.files[0]));
      } else {
        document.getElementById('show-upload-btn').addEventListener('click', () => { state.showUpload = true; render(); });
      }
    }

    document.querySelectorAll('#direction-group .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.progress.settings.direction = btn.dataset.val;
        saveProgress();
        render();
      });
    });
    document.querySelectorAll('#length-group .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.progress.settings.roundLength = btn.dataset.val;
        saveProgress();
        render();
      });
    });
    document.querySelectorAll('#answermode-group .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.progress.settings.answerMode = btn.dataset.val;
        saveProgress();
        render();
      });
    });
    document.getElementById('autospeak-toggle').addEventListener('change', (e) => {
      state.progress.settings.autoSpeak = e.target.checked;
      saveProgress();
    });
    document.getElementById('soundfx-toggle').addEventListener('change', (e) => {
      state.progress.settings.soundEffects = e.target.checked;
      saveProgress();
    });
    document.getElementById('achievements-btn').addEventListener('click', () => {
      state.screen = 'achievements';
      render();
    });
    document.getElementById('export-btn').addEventListener('click', exportProgress);
    document.getElementById('import-file').addEventListener('change', (e) => importProgress(e.target.files[0]));
    document.getElementById('import-btn-label').addEventListener('click', () => document.getElementById('import-file').click());
  }

  function renderQuiz() {
    const app = document.getElementById('app');
    const current = state.questions[state.index];
    if (!current) return;

    let tilesHtml = '';
    state.questions.forEach((_, i) => {
      let bg = 'var(--outline)';
      if (i < state.results.length) bg = state.results[i].correct ? COLORS.green : COLORS.red;
      else if (i === state.index) bg = COLORS.ochre;
      tilesHtml += `<div class="tile" style="background:${bg}"></div>`;
    });

    const promptWord = current.direction === 'es-en' ? current.es : current.en;
    const answerWord = current.direction === 'es-en' ? current.en : current.es;
    const promptLang = current.direction === 'es-en' ? 'es-ES' : 'en-US';
    const answerLang = current.direction === 'es-en' ? 'en-US' : 'es-ES';

    const useChoice = state.effectiveAnswerMode === 'choice' && state.currentOptions;
    const shouldFlip = state.lastFlippedIndex !== state.index;
    if (shouldFlip) state.lastFlippedIndex = state.index;

    let bottomHtml;

    if (useChoice) {
      const acceptable = splitAnswers(current.direction === 'es-en' ? current.en : current.es).map(normalize);
      let optionsHtml = '<div class="option-list" id="options-container">';
      state.currentOptions.forEach((opt) => {
        let cls = 'option-btn';
        if (state.checked) {
          const isCorrectOpt = acceptable.includes(normalize(opt));
          if (isCorrectOpt) cls += ' correct-choice pop-anim';
          else if (opt === state.selectedOption) cls += ' wrong-choice shake-anim';
        }
        optionsHtml += `<button class="${cls}" ${state.checked ? 'disabled' : ''}>${esc(opt)}</button>`;
      });
      optionsHtml += '</div>';

      let feedbackHtml = '';
      if (state.checked) {
        if (state.wasCorrect) {
          feedbackHtml = `<div class="feedback correct"><div class="title">✅ Correct</div></div>`;
        } else {
          feedbackHtml = `
            <div class="feedback wrong"><div class="title">❌ Not quite</div></div>
            <button id="next-btn" class="btn-primary">Next word</button>
            <div class="countdown-bar-track"><div class="countdown-bar-fill" id="countdown-fill"></div></div>
          `;
        }
      }
      bottomHtml = optionsHtml + feedbackHtml;
    } else if (!state.checked) {
      bottomHtml = `
        <input id="answer-input" type="text" placeholder="Type the translation…" value="${esc(state.input)}" autocomplete="off" />
        <button id="check-btn" class="btn-primary">Check</button>
      `;
    } else {
      bottomHtml = `
        <div class="feedback ${state.wasCorrect ? 'correct' : 'wrong'}">
          <div class="title">${state.wasCorrect ? '✅ Correct' : '❌ Not quite'}</div>
          ${!state.wasCorrect ? `<div class="answer">Correct answer: <strong>${esc(answerWord)}</strong> <button id="speak-answer-btn" class="speak-btn" title="Hear it" style="width:26px;height:26px;font-size:12px;">🔊</button></div>` : ''}
          ${state.wasCorrect && state.lastWasTypo ? `<div class="answer">✓ Close enough — small typo forgiven</div>` : ''}
        </div>
        <button id="next-btn" class="btn-primary">${state.index + 1 >= state.questions.length ? 'See results' : 'Next word'}</button>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="tiles" style="grid-template-columns: repeat(${Math.min(state.questions.length, 20)}, 1fr);">${tilesHtml}</div>
          <div class="progress-label">${state.index + 1} / ${state.questions.length} · ${current.direction === 'es-en' ? 'ES → EN' : 'EN → ES'}</div>
          <div class="prompt-card ${shouldFlip ? 'card-flip-in' : ''}">
            <div class="prompt-row">
              <div class="prompt-word">${esc(promptWord)}</div>
              <button id="speak-prompt-btn" class="speak-btn" title="Hear it">🔊</button>
            </div>
          </div>
          ${bottomHtml}
        </div>
      </div>
    `;

    const speakPromptBtn = document.getElementById('speak-prompt-btn');
    speakPromptBtn.addEventListener('click', () => speak(promptWord, promptLang, speakPromptBtn));

    if (useChoice) {
      if (!state.checked) {
        document.querySelectorAll('#options-container .option-btn').forEach((btn, i) => {
          btn.addEventListener('click', () => selectOption(state.currentOptions[i]));
        });
        if (state.progress.settings.autoSpeak) speak(promptWord, promptLang, speakPromptBtn);
      } else if (!state.wasCorrect) {
        document.getElementById('next-btn').addEventListener('click', nextQuestion);
        const fill = document.getElementById('countdown-fill');
        if (fill) {
          requestAnimationFrame(() => { requestAnimationFrame(() => { fill.style.width = '0%'; }); });
        }
      }
    } else if (!state.checked) {
      const input = document.getElementById('answer-input');
      input.focus();
      input.addEventListener('input', (e) => { state.input = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.stopPropagation();
          submitAnswer();
        }
      });
      document.getElementById('check-btn').addEventListener('click', submitAnswer);
      if (state.progress.settings.autoSpeak) speak(promptWord, promptLang, speakPromptBtn);
    } else {
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
      const speakAnswerBtn = document.getElementById('speak-answer-btn');
      if (speakAnswerBtn) speakAnswerBtn.addEventListener('click', () => speak(answerWord, answerLang, speakAnswerBtn));
    }
  }

  function renderResult() {
    const app = document.getElementById('app');
    const score = state.results.filter(r => r.correct).length;
    const total = state.results.length;
    const missed = state.results.filter(r => !r.correct);
    const streak = state.progress.streak;

    let mosaicHtml = '';
    state.results.forEach(r => {
      mosaicHtml += `<div class="sq" style="background:${r.correct ? COLORS.green : COLORS.red}"></div>`;
    });

    let reviewHtml = '';
    if (missed.length > 0) {
      let itemsHtml = '';
      missed.forEach(r => {
        itemsHtml += `
          <div class="review-item">
            <span class="from">${esc(r.prompt)}</span> → <span class="to">${esc(r.correctAnswer)}</span>
            ${r.userAnswer ? `<div class="yours">You wrote: ${esc(r.userAnswer)}</div>` : ''}
          </div>
        `;
      });
      reviewHtml = `
        <div class="card" style="margin-bottom:20px;">
          <div class="review-title">Words to review</div>
          ${itemsHtml}
        </div>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="eyebrow">Resultado</div>
          <div class="score-big" style="margin-bottom:12px;">${score}/${total}</div>
          ${state.newBestThisRound ? `<div class="new-best">🔥 New best streak: ${streak.best}</div>` : ''}
          <div class="streak-line">Current streak: ${streak.current} &nbsp;·&nbsp; Best: ${streak.best}</div>
          <div class="mosaic">${mosaicHtml}</div>
          ${reviewHtml}
          <button id="again-btn" class="btn-primary" style="margin-bottom:10px;">Play again</button>
          <div class="btn-row">
            <button id="menu-btn" class="btn-secondary">Change settings</button>
            <button id="new-btn" class="btn-secondary">New list</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('again-btn').addEventListener('click', startQuiz);
    document.getElementById('menu-btn').addEventListener('click', backToMenu);
    document.getElementById('new-btn').addEventListener('click', playAgainFromScratch);

    const strongScore = total > 0 && (score / total) >= 0.8;
    if (strongScore || state.newBestThisRound) {
      launchConfetti();
    }
  }

  function renderAchievements() {
    const app = document.getElementById('app');
    const ids = Object.keys(ACHIEVEMENTS);
    const itemsHtml = ids.map(id => {
      const def = ACHIEVEMENTS[id];
      const rec = state.progress.achievements[id];
      const unlocked = !!(rec && rec.unlocked);
      return `
        <div class="achievement-item ${unlocked ? 'unlocked' : 'locked'}">
          <div class="ach-icon">${unlocked ? def.icon : '🔒'}</div>
          <div class="ach-text">
            <div class="ach-name">${esc(def.name)}</div>
            <div class="ach-desc">${esc(def.desc)}</div>
          </div>
        </div>
      `;
    }).join('');

    app.innerHTML = `
      <div class="screen upload-screen">
        <div class="wrap">
          <div class="eyebrow">Logros</div>
          <h1 style="font-size: 34px; margin-top: 8px;">Achievements</h1>
          <div class="card" style="margin-top: 20px;">
            ${itemsHtml}
          </div>
          <button id="back-from-ach-btn" class="btn-secondary" style="width:100%; margin-top:16px;">Back</button>
        </div>
      </div>
    `;
    document.getElementById('back-from-ach-btn').addEventListener('click', () => { state.screen = 'start'; render(); });
  }

  function renderTimeAttack() {
    const app = document.getElementById('app');
    const current = state.taCurrentQuestion;
    if (!current) return;

    const promptWord = current.direction === 'es-en' ? current.es : current.en;
    const promptLang = current.direction === 'es-en' ? 'es-ES' : 'en-US';

    let bottomHtml;
    if (state.effectiveAnswerMode === 'choice' && state.taCurrentOptions) {
      let optHtml = '<div class="option-list" id="ta-options">';
      state.taCurrentOptions.forEach(opt => {
        optHtml += `<button class="option-btn">${esc(opt)}</button>`;
      });
      optHtml += '</div>';
      bottomHtml = optHtml;
    } else {
      bottomHtml = `
        <input id="ta-input" type="text" placeholder="Type the translation…" value="${esc(state.taInput)}" autocomplete="off" />
        <button id="ta-check-btn" class="btn-primary">Check</button>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="ta-header">
            <div class="ta-timer-track"><div class="ta-timer-fill" id="ta-timer-fill" style="width:${(state.taTimeLeft / 60 * 100)}%;"></div></div>
            <div class="ta-stats-row">
              <div class="ta-score-label">Score: <span id="ta-score">${state.taScore}</span></div>
              <div class="ta-timer-label" id="ta-timer">${state.taTimeLeft}s</div>
            </div>
          </div>
          <div class="prompt-card" id="ta-prompt-card">
            <div class="prompt-row">
              <div class="prompt-word">${esc(promptWord)}</div>
              <button id="ta-speak-btn" class="speak-btn" title="Hear it">🔊</button>
            </div>
          </div>
          ${bottomHtml}
          <button id="ta-quit-btn" class="link-btn" style="display:block; text-align:center; width:100%; margin-top:14px;">End early</button>
        </div>
      </div>
    `;

    const speakBtn = document.getElementById('ta-speak-btn');
    speakBtn.addEventListener('click', () => speak(promptWord, promptLang, speakBtn));
    if (state.progress.settings.autoSpeak) speak(promptWord, promptLang, speakBtn);

    if (state.effectiveAnswerMode === 'choice' && state.taCurrentOptions) {
      document.querySelectorAll('#ta-options .option-btn').forEach((btn, i) => {
        btn.addEventListener('click', () => taSelectOption(state.taCurrentOptions[i]));
      });
    } else {
      const input = document.getElementById('ta-input');
      input.focus();
      input.addEventListener('input', (e) => { state.taInput = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.stopPropagation();
          handleTaTypedSubmit();
        }
      });
      document.getElementById('ta-check-btn').addEventListener('click', handleTaTypedSubmit);
    }

    document.getElementById('ta-quit-btn').addEventListener('click', () => {
      if (confirm('End this Time Attack round early?')) endTimeAttack();
    });
  }

  function renderTimeAttackResult() {
    const app = document.getElementById('app');
    const missed = state.results.filter(r => !r.correct);
    const best = state.progress.timeAttackBest || 0;

    let reviewHtml = '';
    if (missed.length > 0) {
      let itemsHtml = '';
      missed.slice(0, 20).forEach(r => {
        itemsHtml += `
          <div class="review-item">
            <span class="from">${esc(r.prompt)}</span> → <span class="to">${esc(r.correctAnswer)}</span>
          </div>
        `;
      });
      reviewHtml = `
        <div class="card" style="margin-bottom:20px;">
          <div class="review-title">Words to review</div>
          ${itemsHtml}
          ${missed.length > 20 ? `<div style="font-size:12px;color:var(--cream-dim);margin-top:8px;">+ ${missed.length - 20} more</div>` : ''}
        </div>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="eyebrow">Contra reloj</div>
          <div class="score-big" style="margin-bottom:8px;">${state.taScore}</div>
          <div class="streak-line">correct in 60 seconds</div>
          ${state.taIsNewBest ? `<div class="new-best">🏆 New best score!</div>` : `<div class="streak-line">Best: ${best}</div>`}
          ${reviewHtml}
          <button id="ta-again-btn" class="btn-primary" style="margin-bottom:10px;">Go again</button>
          <div class="btn-row">
            <button id="ta-menu-btn" class="btn-secondary">Change settings</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('ta-again-btn').addEventListener('click', startTimeAttack);
    document.getElementById('ta-menu-btn').addEventListener('click', backToMenu);
  }

  function render() {
    if (state.screen === 'start') renderStart();
    else if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'timeattack') renderTimeAttack();
    else if (state.screen === 'result') {
      if (state.resultMode === 'timeattack') renderTimeAttackResult();
      else renderResult();
    }
    else if (state.screen === 'achievements') renderAchievements();
  }

  // Single, stable listener for advancing on Enter from the feedback screen.
  // (Installed once — not re-created per render — so it can never stack up.)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && state.screen === 'quiz' && state.checked) {
      nextQuestion();
    }
  });

  loadFromRepo();
</script>
</body>
</html>
