<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palabra — Spanish Vocab Quiz</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#A6091C" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-512.png" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --bg: #A6091C;
    --bg-card: #8C0817;
    --bg-card-alt: #7A0713;
    --ochre: #FFC400;
    --terracotta: #FF6B57;
    --cream: #FFF6E0;
    --cream-dim: #F0BFC0;
    --green: #4C9A5B;
    --red: #FF6B57;
    --outline: #5C0E14;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }
  .upload-screen { justify-content: center; }

  .wrap { width: 100%; max-width: 420px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--ochre);
    text-transform: uppercase;
    text-align: center;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 42px;
    margin: 8px 0;
    line-height: 1.05;
    text-align: center;
  }
  .sub {
    color: var(--cream-dim);
    font-size: 15px;
    line-height: 1.5;
    text-align: center;
    margin: 0 0 20px;
  }

  .card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--outline);
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--outline);
    border-top-color: var(--ochre);
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dropzone {
    display: block;
    text-align: center;
    padding: 28px 16px;
    border: 2px dashed var(--outline);
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .dropzone .icon { font-size: 28px; margin-bottom: 6px; }
  .dropzone .name { font-weight: 600; }
  .dropzone .hint { font-size: 13px; color: var(--cream-dim); margin-top: 4px; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 16px;
  }

  .msg-error {
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .msg-ok {
    font-size: 14px;
    color: var(--ochre);
    margin-bottom: 16px;
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-bottom: 16px;
    display: inline-block;
  }

  button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 16px;
    background: var(--ochre);
    color: var(--bg);
  }
  .btn-primary:disabled {
    cursor: not-allowed;
    background: var(--outline);
    color: var(--cream-dim);
  }
  .btn-secondary {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: 1px solid var(--outline);
    font-weight: 600;
    font-size: 14px;
    background: transparent;
    color: var(--cream);
  }

  .tiles {
    display: grid;
    gap: 4px;
    margin-bottom: 32px;
  }
  .tile { height: 8px; border-radius: 2px; background: var(--outline); }

  .progress-label {
    text-align: center;
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--ochre);
  }

  .prompt-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
    border: 1px solid var(--outline);
    margin-bottom: 20px;
  }
  .prompt-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .prompt-word {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
  }
  .speak-btn {
    background: none;
    border: 1px solid var(--outline);
    color: var(--cream);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream);
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
    font-family: 'Inter', sans-serif;
  }

  .feedback {
    padding: 16px 18px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .feedback.correct {
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--green);
  }
  .feedback.wrong {
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--red);
  }
  .feedback .title { font-weight: 600; }
  .feedback .answer { font-size: 14px; color: var(--cream-dim); margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .feedback .answer strong { color: var(--cream); }

  .score-big {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    text-align: center;
  }

  .new-best {
    text-align: center;
    color: var(--ochre);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .streak-line {
    text-align: center;
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 20px;
  }

  .mosaic {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 28px;
  }
  .mosaic .sq { aspect-ratio: 1; border-radius: 4px; }

  .review-title { font-weight: 600; margin-bottom: 12px; }
  .review-item {
    font-size: 14px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--outline);
  }
  .review-item:last-child { border-bottom: none; margin-bottom: 0; }
  .review-item .from { color: var(--cream-dim); }
  .review-item .to { color: var(--cream); font-weight: 600; }
  .review-item .yours { color: var(--terracotta); font-size: 13px; margin-top: 2px; }

  .btn-row { display: flex; gap: 10px; }

  .settings-group { margin-bottom: 16px; text-align: left; }
  .settings-label {
    font-size: 12px;
    color: var(--cream-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .segmented { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg-btn {
    flex: 1;
    min-width: 64px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream-dim);
    font-size: 13px;
    font-weight: 600;
  }
  .seg-btn.active {
    background: var(--ochre);
    border-color: var(--ochre);
    color: var(--bg);
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // ── Edit this to match the file name sitting in your repo ──
  const WORDS_FILE = 'words.xlsx';
  // ─────────────────────────────────────────────────────────

  const STORAGE_KEY = 'palabraProgress_v1';

  const COLORS = {
    green: '#4C9A5B',
    red: '#FF6B57',
    ochre: '#FFC400',
  };

  function defaultProgress() {
    return {
      wordStats: {},
      streak: { current: 0, best: 0 },
      lifetime: { totalAnswered: 0, totalCorrect: 0 },
      settings: { direction: 'mixed', roundLength: '20', autoSpeak: true },
    };
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      const parsed = JSON.parse(raw);
      const merged = defaultProgress();
      merged.wordStats = parsed.wordStats || {};
      merged.streak = Object.assign(merged.streak, parsed.streak || {});
      merged.lifetime = Object.assign(merged.lifetime, parsed.lifetime || {});
      merged.settings = Object.assign(merged.settings, parsed.settings || {});
      return merged;
    } catch (e) {
      return defaultProgress();
    }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
    } catch (e) {
      // storage unavailable (private browsing etc.) - fail silently
    }
  }

  function exportProgress() {
    const blob = new Blob([JSON.stringify(state.progress, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'palabra-progress.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importProgress(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const parsed = JSON.parse(evt.target.result);
        const merged = defaultProgress();
        merged.wordStats = parsed.wordStats || {};
        merged.streak = Object.assign(merged.streak, parsed.streak || {});
        merged.lifetime = Object.assign(merged.lifetime, parsed.lifetime || {});
        merged.settings = Object.assign(merged.settings, parsed.settings || {});
        state.progress = merged;
        saveProgress();
        render();
      } catch (e) {
        alert("That file doesn't look like a valid progress export.");
      }
    };
    reader.readAsText(file);
  }

  const state = {
    screen: 'start', // start | quiz | result
    loading: true,
    fetchFailed: false,
    showUpload: false,
    pairs: [],
    error: '',
    hasHeader: true,
    fileName: '',
    rawRows: null,
    questions: [],
    index: 0,
    input: '',
    checked: false,
    wasCorrect: false,
    results: [],
    newBestThisRound: false,
    progress: loadProgress(),
  };

  function normalize(str) {
    return str.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function splitAnswers(cell) {
    return cell.toString().split(/[/;,]/).map(s => s.trim()).filter(Boolean);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function wordKey(pair) {
    return normalize(pair.es) + '::' + normalize(pair.en);
  }

  function getWeight(pair) {
    const stats = state.progress.wordStats[wordKey(pair)];
    if (!stats) return 1;
    const diff = (stats.wrong || 0) - (stats.right || 0);
    return Math.max(1, 1 + diff * 1.5);
  }

  function weightedSampleWithoutReplacement(items, weightFn, count) {
    const pool = items.map(item => ({ item, weight: Math.max(weightFn(item), 0.0001) }));
    const result = [];
    while (result.length < count && pool.length > 0) {
      const totalWeight = pool.reduce((sum, p) => sum + p.weight, 0);
      let r = Math.random() * totalWeight;
      let idx = 0;
      for (; idx < pool.length - 1; idx++) {
        r -= pool[idx].weight;
        if (r <= 0) break;
      }
      result.push(pool[idx].item);
      pool.splice(idx, 1);
    }
    return result;
  }

  function buildRound(pairs, length, directionSetting) {
    let selected = [];
    while (selected.length < length) {
      const remaining = length - selected.length;
      const batchSize = Math.min(remaining, pairs.length);
      const batch = weightedSampleWithoutReplacement(pairs, getWeight, batchSize);
      selected = selected.concat(batch);
    }
    return selected.map(p => ({
      ...p,
      direction: directionSetting === 'mixed' ? (Math.random() < 0.5 ? 'es-en' : 'en-es') : directionSetting,
    }));
  }

  function speak(text, lang) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    } catch (e) {
      // ignore - speech not critical to functioning
    }
  }

  function parseRows(rows, skipHeader) {
    const startIdx = skipHeader ? 1 : 0;
    const cleaned = [];
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      const es = (row[0] ?? '').toString().trim();
      const en = (row[1] ?? '').toString().trim();
      if (es && en) cleaned.push({ es, en });
    }
    if (cleaned.length === 0) {
      state.error = 'No word pairs found. Make sure column A has Spanish and column B has English.';
      state.pairs = [];
    } else {
      state.error = '';
      state.pairs = cleaned;
    }
    render();
  }

  // Auto-load the word list from the repo on page load
  async function loadFromRepo() {
    state.loading = true;
    state.fetchFailed = false;
    render();
    try {
      const resp = await fetch(WORDS_FILE);
      if (!resp.ok) throw new Error('File not found: ' + resp.status);
      const buf = await resp.arrayBuffer();
      const data = new Uint8Array(buf);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      state.rawRows = rows;
      state.fileName = WORDS_FILE;
      state.loading = false;
      parseRows(rows, state.hasHeader);
    } catch (err) {
      state.loading = false;
      state.fetchFailed = true;
      state.showUpload = true;
      state.error = "Couldn't load \"" + WORDS_FILE + "\" automatically. If you're opening this file directly on your computer rather than through GitHub Pages or a local server, browsers block that kind of file access — try uploading it manually below, or view the page via its GitHub Pages URL instead.";
      render();
    }
  }

  function handleFile(file) {
    if (!file) return;
    state.error = '';
    state.fileName = file.name;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        state.rawRows = rows;
        parseRows(rows, state.hasHeader);
      } catch (err) {
        state.error = "Couldn't read that file. Make sure it's a valid .xlsx or .xls file.";
        state.pairs = [];
        render();
      }
    };
    reader.onerror = () => { state.error = "Couldn't read that file."; render(); };
    reader.readAsArrayBuffer(file);
  }

  function toggleHeader() {
    state.hasHeader = !state.hasHeader;
    if (state.rawRows) parseRows(state.rawRows, state.hasHeader);
    else render();
  }

  function startQuiz() {
    const settings = state.progress.settings;
    const roundLen = settings.roundLength === 'all' ? state.pairs.length : parseInt(settings.roundLength, 10);
    state.questions = buildRound(state.pairs, roundLen, settings.direction);
    state.index = 0;
    state.results = [];
    state.input = '';
    state.checked = false;
    state.newBestThisRound = false;
    state.screen = 'quiz';
    render();
  }

  function submitAnswer() {
    const current = state.questions[state.index];
    if (!current || state.checked) return;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const acceptable = splitAnswers(targetField).map(normalize);
    const userNorm = normalize(state.input);
    const correct = userNorm.length > 0 && acceptable.includes(userNorm);
    state.wasCorrect = correct;
    state.checked = true;
    state.results.push({
      prompt: current.direction === 'es-en' ? current.es : current.en,
      correctAnswer: targetField,
      userAnswer: state.input,
      correct,
    });

    const key = wordKey(current);
    if (!state.progress.wordStats[key]) state.progress.wordStats[key] = { wrong: 0, right: 0 };
    if (correct) {
      state.progress.wordStats[key].right += 1;
      state.progress.streak.current += 1;
      if (state.progress.streak.current > state.progress.streak.best) {
        state.progress.streak.best = state.progress.streak.current;
        state.newBestThisRound = true;
      }
    } else {
      state.progress.wordStats[key].wrong += 1;
      state.progress.streak.current = 0;
    }
    state.progress.lifetime.totalAnswered += 1;
    if (correct) state.progress.lifetime.totalCorrect += 1;
    saveProgress();

    render();
  }

  function nextQuestion() {
    if (state.index + 1 >= state.questions.length) {
      state.screen = 'result';
    } else {
      state.index += 1;
      state.input = '';
      state.checked = false;
    }
    render();
  }

  function playAgainFromScratch() {
    state.screen = 'start';
    loadFromRepo();
  }

  function backToMenu() {
    state.screen = 'start';
    render();
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderStart() {
    const app = document.getElementById('app');
    const settings = state.progress.settings;
    const streak = state.progress.streak;

    let statusHtml = '';
    if (state.loading) {
      statusHtml = `<div class="status-line"><div class="spinner"></div> Loading word list from ${esc(WORDS_FILE)}…</div>`;
    } else if (state.error) {
      statusHtml = `<div class="msg-error">${esc(state.error)}</div>`;
    } else if (state.pairs.length > 0) {
      statusHtml = `<div class="msg-ok">✓ ${state.pairs.length} word${state.pairs.length === 1 ? '' : 's'} loaded from ${esc(state.fileName)}</div>`;
    }

    let uploadHtml = '';
    if (!state.loading && state.showUpload) {
      uploadHtml = `
        <label class="dropzone" for="file-upload">
          <div class="icon">📄</div>
          <div class="name">Choose Excel file</div>
          <div class="hint">Column A: Spanish · Column B: English</div>
        </label>
        <input id="file-upload" type="file" accept=".xlsx,.xls" style="display:none" />
      `;
    }

    let toggleLinkHtml = '';
    if (!state.loading && !state.showUpload) {
      toggleLinkHtml = `<button id="show-upload-btn" class="link-btn">Use a different word list instead</button><br/>`;
    }

    const directionOptions = [['mixed', 'Mixed'], ['es-en', 'ES → EN'], ['en-es', 'EN → ES']];
    const lengthOptions = [['10', '10'], ['20', '20'], ['50', '50'], ['all', 'All']];

    const directionHtml = directionOptions.map(([val, label]) =>
      `<button class="seg-btn ${settings.direction === val ? 'active' : ''}" data-val="${val}">${label}</button>`
    ).join('');
    const lengthHtml = lengthOptions.map(([val, label]) =>
      `<button class="seg-btn ${settings.roundLength === val ? 'active' : ''}" data-val="${val}">${label}</button>`
    ).join('');

    const roundLabel = settings.roundLength === 'all' ? (state.pairs.length + ' words') : (settings.roundLength + ' words');

    app.innerHTML = `
      <div class="screen upload-screen">
        <div class="wrap">
          <div class="eyebrow">Vocabulario</div>
          <h1>Palabra</h1>
          <p class="sub">Quizzed in the direction and length you choose, straight from your word list.</p>
          <div class="streak-line">🔥 Current streak: ${streak.current} &nbsp;·&nbsp; Best: ${streak.best}</div>
          <div class="card">
            ${statusHtml}
            ${uploadHtml}
            ${!state.loading ? `<label class="checkbox-row"><input id="header-toggle" type="checkbox" ${state.hasHeader ? 'checked' : ''} /> First row is a header (skip it)</label>` : ''}
            ${toggleLinkHtml}

            <div class="settings-group">
              <div class="settings-label">Direction</div>
              <div class="segmented" id="direction-group">${directionHtml}</div>
            </div>
            <div class="settings-group">
              <div class="settings-label">Round length</div>
              <div class="segmented" id="length-group">${lengthHtml}</div>
            </div>
            <label class="checkbox-row">
              <input type="checkbox" id="autospeak-toggle" ${settings.autoSpeak ? 'checked' : ''} /> Pronounce words automatically
            </label>

            <button id="start-btn" class="btn-primary" ${state.pairs.length === 0 ? 'disabled' : ''}>Start quiz — ${roundLabel}</button>

            <div class="btn-row" style="margin-top:16px;">
              <button id="export-btn" class="btn-secondary">Download progress</button>
              <button id="import-btn-label" class="btn-secondary">Upload progress</button>
            </div>
            <input type="file" id="import-file" accept="application/json" style="display:none" />
          </div>
        </div>
      </div>
    `;

    if (!state.loading) {
      document.getElementById('header-toggle').addEventListener('change', toggleHeader);
      document.getElementById('start-btn').addEventListener('click', startQuiz);
      if (state.showUpload) {
        document.getElementById('file-upload').addEventListener('change', (e) => handleFile(e.target.files[0]));
      } else {
        document.getElementById('show-upload-btn').addEventListener('click', () => { state.showUpload = true; render(); });
      }
    }

    document.querySelectorAll('#direction-group .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.progress.settings.direction = btn.dataset.val;
        saveProgress();
        render();
      });
    });
    document.querySelectorAll('#length-group .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.progress.settings.roundLength = btn.dataset.val;
        saveProgress();
        render();
      });
    });
    document.getElementById('autospeak-toggle').addEventListener('change', (e) => {
      state.progress.settings.autoSpeak = e.target.checked;
      saveProgress();
    });
    document.getElementById('export-btn').addEventListener('click', exportProgress);
    document.getElementById('import-file').addEventListener('change', (e) => importProgress(e.target.files[0]));
    document.getElementById('import-btn-label').addEventListener('click', () => document.getElementById('import-file').click());
  }

  function renderQuiz() {
    const app = document.getElementById('app');
    const current = state.questions[state.index];
    if (!current) return;

    let tilesHtml = '';
    state.questions.forEach((_, i) => {
      let bg = 'var(--outline)';
      if (i < state.results.length) bg = state.results[i].correct ? COLORS.green : COLORS.red;
      else if (i === state.index) bg = COLORS.ochre;
      tilesHtml += `<div class="tile" style="background:${bg}"></div>`;
    });

    const promptWord = current.direction === 'es-en' ? current.es : current.en;
    const answerWord = current.direction === 'es-en' ? current.en : current.es;
    const promptLang = current.direction === 'es-en' ? 'es-ES' : 'en-US';
    const answerLang = current.direction === 'es-en' ? 'en-US' : 'es-ES';

    let bottomHtml;
    if (!state.checked) {
      bottomHtml = `
        <input id="answer-input" type="text" placeholder="Type the translation…" value="${esc(state.input)}" autocomplete="off" />
        <button id="check-btn" class="btn-primary">Check</button>
      `;
    } else {
      bottomHtml = `
        <div class="feedback ${state.wasCorrect ? 'correct' : 'wrong'}">
          <div class="title">${state.wasCorrect ? 'Correct' : 'Not quite'}</div>
          ${!state.wasCorrect ? `<div class="answer">Correct answer: <strong>${esc(answerWord)}</strong> <button id="speak-answer-btn" class="speak-btn" title="Hear it" style="width:26px;height:26px;font-size:12px;">🔊</button></div>` : ''}
        </div>
        <button id="next-btn" class="btn-primary">${state.index + 1 >= state.questions.length ? 'See results' : 'Next word'}</button>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="tiles" style="grid-template-columns: repeat(${Math.min(state.questions.length, 20)}, 1fr);">${tilesHtml}</div>
          <div class="progress-label">${state.index + 1} / ${state.questions.length} · ${current.direction === 'es-en' ? 'ES → EN' : 'EN → ES'}</div>
          <div class="prompt-card">
            <div class="prompt-row">
              <div class="prompt-word">${esc(promptWord)}</div>
              <button id="speak-prompt-btn" class="speak-btn" title="Hear it">🔊</button>
            </div>
          </div>
          ${bottomHtml}
        </div>
      </div>
    `;

    document.getElementById('speak-prompt-btn').addEventListener('click', () => speak(promptWord, promptLang));

    if (!state.checked) {
      const input = document.getElementById('answer-input');
      input.focus();
      input.addEventListener('input', (e) => { state.input = e.target.value; });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.stopPropagation();
          submitAnswer();
        }
      });
      document.getElementById('check-btn').addEventListener('click', submitAnswer);

      if (state.progress.settings.autoSpeak) speak(promptWord, promptLang);
    } else {
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
      const speakAnswerBtn = document.getElementById('speak-answer-btn');
      if (speakAnswerBtn) speakAnswerBtn.addEventListener('click', () => speak(answerWord, answerLang));
    }
  }

  function renderResult() {
    const app = document.getElementById('app');
    const score = state.results.filter(r => r.correct).length;
    const missed = state.results.filter(r => !r.correct);
    const streak = state.progress.streak;

    let mosaicHtml = '';
    state.results.forEach(r => {
      mosaicHtml += `<div class="sq" style="background:${r.correct ? COLORS.green : COLORS.red}"></div>`;
    });

    let reviewHtml = '';
    if (missed.length > 0) {
      let itemsHtml = '';
      missed.forEach(r => {
        itemsHtml += `
          <div class="review-item">
            <span class="from">${esc(r.prompt)}</span> → <span class="to">${esc(r.correctAnswer)}</span>
            ${r.userAnswer ? `<div class="yours">You wrote: ${esc(r.userAnswer)}</div>` : ''}
          </div>
        `;
      });
      reviewHtml = `
        <div class="card" style="margin-bottom:20px;">
          <div class="review-title">Words to review</div>
          ${itemsHtml}
        </div>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="eyebrow">Resultado</div>
          <div class="score-big" style="margin-bottom:12px;">${score}/${state.results.length}</div>
          ${state.newBestThisRound ? `<div class="new-best">🔥 New best streak: ${streak.best}</div>` : ''}
          <div class="streak-line">Current streak: ${streak.current} &nbsp;·&nbsp; Best: ${streak.best}</div>
          <div class="mosaic">${mosaicHtml}</div>
          ${reviewHtml}
          <button id="again-btn" class="btn-primary" style="margin-bottom:10px;">Play again</button>
          <div class="btn-row">
            <button id="menu-btn" class="btn-secondary">Change settings</button>
            <button id="new-btn" class="btn-secondary">New list</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('again-btn').addEventListener('click', startQuiz);
    document.getElementById('menu-btn').addEventListener('click', backToMenu);
    document.getElementById('new-btn').addEventListener('click', playAgainFromScratch);
  }

  function render() {
    if (state.screen === 'start') renderStart();
    else if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'result') renderResult();
  }

  // Single, stable listener for advancing on Enter from the feedback screen.
  // (Installed once — not re-created per render — so it can never stack up.)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && state.screen === 'quiz' && state.checked) {
      nextQuestion();
    }
  });

  loadFromRepo();
</script>
</body>
</html>
